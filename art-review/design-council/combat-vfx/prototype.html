<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>演算法特效實驗：光束／折面／刀痕</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10181e;color:#e4f2f4;font:15px system-ui,sans-serif}main{max-width:1220px;margin:auto;padding:26px}h1{font-size:27px;margin:0 0 7px}p{color:#a4bdc5;line-height:1.6;margin:6px 0 18px}.eyebrow{color:#7fe2d0;font-size:12px;letter-spacing:2px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select{color:#dceff2;background:#22343f;border:1px solid #4b6976;border-radius:6px;padding:10px 14px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#9fe7db;color:#10252b;border-color:#9fe7db}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}canvas{width:100%;aspect-ratio:860/490;border:1px solid #3e5b67;border-radius:10px;background:#173137}aside{padding:18px;background:#17262f;border:1px solid #304751;border-radius:10px}aside h2{font-size:18px;margin:0 0 12px}dt{color:#82dfd0;margin-top:16px}dd{margin:5px 0 0;color:#bacbd0;line-height:1.6;font-size:13px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}input[type=range]{width:230px;accent-color:#98e1d5}.status{font-variant-numeric:tabular-nums;color:#a6d4df;font-size:13px}.note{margin-top:18px;font-size:12px}@media(max-width:800px){main{padding:16px}.layout{grid-template-columns:1fr}aside{display:none}h1{font-size:23px}input[type=range]{width:160px}}
</style>
<main><div class="eyebrow">PROGRAMMABLE VFX / DESIGN EXPERIMENT</div><h1>讓演算法同時服務手感與可讀性</h1><p>獨立技術原型，尚未接入正式遊戲。替身角色只標示位置；重點是形變、接觸時刻與碰撞邊界。</p>
<nav><button data-demo="beam" aria-pressed="true">01 青白額砲</button><button data-demo="sky">02 天空折面</button><button data-demo="slash">03 刀刃軌跡</button></nav>
<div class="layout"><section><canvas id="view" width="860" height="490" aria-label="演算法特效畫布"></canvas><div class="controls"><button id="play">暫停</button><label>時間 <input id="time" type="range" min="0" max="320" value="0"></label><select id="quality" aria-label="品質"><option value="high">桌機品質</option><option value="low">手機降階</option></select><select id="density" aria-label="像素密度"><option value="1">DPR 1</option><option value="2">DPR 2</option></select><label><input id="bounds" type="checkbox" checked> 命中邊界</label><label><input id="double" type="checkbox"> 雙折面</label><label><input id="camera" type="checkbox"> 相機位移</label></div><p class="status" id="status"></p></section><aside><h2 id="title"></h2><dl id="details"></dl></aside></div>
<p class="note">畫面可暫停、拖曳時間與切換品質。接觸前不扣血、暫停不推進、同一施術只結算一次；桌機與手機模式共用同一套命中邏輯。演算法與小型測試均可在此目錄查看。</p>
</main><script src="algorithms.js"></script><script src="prototype.js"></script></html>
