<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鹿丸｜人體投影動態樣品</title>
<style>*{box-sizing:border-box}body{margin:0;background:#161a17;color:#eee9da;font:14px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:16px}h1{font-size:21px;margin:0 0 8px}p{color:#b8beb1;line-height:1.5;margin:8px 0}nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;border:1px solid #64705c;background:#293126;color:#eee9da;border-radius:6px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#d0d5b5;color:#1b2519}canvas{display:block;width:100%;background:#345b31;border:1px solid #53634b;image-rendering:pixelated}label{display:flex;align-items:center;gap:7px}input{width:160px}#state{min-height:24px;color:#e6dca9}small{color:#abb6a3}@media(max-width:500px){main{padding:10px}h1{font-size:18px}button{padding:7px 9px}input{width:120px}}</style>
<main><h1>鹿丸：人體投影 → 群影融合 → 高拱影縫</h1><p>純視覺動態樣品。使用現行人物圖集與遊戲草地；未接傷害、技能或成長系統。</p>
<nav id="modes"><button data-mode="body" aria-pressed="true">人體投影</button><button data-mode="group">捕群融合</button><button data-mode="sewing">高拱影縫</button><button data-mode="neck">貼身首縛研究</button></nav>
<nav><label>展示階段<select id="tier"><option value="1">起始：一根／一目標</option><option value="2">少量投資：接第二目標</option><option value="3">成形：接續群體</option></select></label><label>影縫方向<select id="direction"><option value="right">右</option><option value="left">左</option><option value="up">上</option><option value="down">下</option></select></label><label>群體距離<select id="spacing"><option value="near">近群融合</option><option value="far">散群細接</option></select></label><button id="pause">暫停</button><button id="restart">重播</button><label>相位<input id="seek" type="range" min="0" max="8" step=".01" value="0"></label></nav>
<div id="state">載入現用素材…</div><canvas id="demo"></canvas><p id="explain"></p><small>比例：桌機人物高64px，窄螢幕人物高40px。拖曳相位可檢查首段、接觸、成形與收回；按空白鍵暫停。此頁不載入或修改產品戰鬥模組。</small></main>
