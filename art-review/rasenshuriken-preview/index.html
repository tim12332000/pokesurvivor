<main>
<div class="eyebrow">NARUTO / WIND STYLE</div>
<h1>風遁・螺旋手裏劍</h1>
<p>螺旋丸球心 × 四片風刃 · 遊戲同款像素顆粒與藍白色階</p>
<div class="panel" style="max-width:540px;margin:auto"><iframe id="game" title="正式遊戲視角・螺旋手裏劍預覽" style="display:block;width:100%;height:min(72vh,720px);min-height:480px;border:0" src="../../.omx/digimon.html?lang=zh-TW&amp;layout=portrait&amp;rasenPreview=2"></iframe></div>
<nav><button id="play">暫停</button><button id="replay">重播</button><label>速度 <select id="speed"><option value="1">正常 1×</option><option value="0.5">慢放 0.5×</option><option value="0.25">慢放 0.25×</option></select></label><button id="style" aria-pressed="false">對照第三版</button><button id="original" aria-pressed="false">對照現版風刃</button><label>方向 <select id="direction"><option value="-0.65">右上</option><option value="0">右</option><option value="-1.57">上</option><option value="2.49">左下</option></select></label></nav>
<input id="seek" type="range" min="0" max="2200" value="0" aria-label="動畫時間">
<div class="time"><span id="phase">聚風</span><span id="clock">0.00 s</span></div>
<div class="cuts"><button id="spin" aria-pressed="false">原地看旋轉</button><button data-time="0.36">聚風</button><button data-time="0.84">飛行</button><button data-time="1.20">爆開</button><button data-time="1.48">散去</button></div>
<details class="sources"><summary>本次動態參考</summary><p>已逐格檢視蓄力與出手 GIF：四片彎曲風刃掃成風盤，外緣殘影持續變化。預覽以遊戲的像素色階重新表現。<a href="https://makeagif.com/gif/wind-style-rasenshuriken-0EwUz9" target="_blank" rel="noopener">蓄力旋轉片段</a> · <a href="https://gifdb.com/gif/naruto-rasenshuriken-toss-ac7txmb01y2w9oyr.html" target="_blank" rel="noopener">出手片段</a> · <a href="https://www.youtube.com/watch?v=GOBZIdBKaHw" target="_blank" rel="noopener">Crunchyroll 招式片段</a></p></details>
<p class="sources">與正式遊戲共用特效；此頁循環重播單次演出。正式遊戲基礎 CD 6 秒，學會後常駐自動、不需選招。姿勢沿用專案的投擲動作。<br>參考：<a href="https://spritedatabase.net/game/55" target="_blank" rel="noopener">Ninja Council 3 風格</a> · <a href="https://spritedatabase.net/display.php?object=1409" target="_blank" rel="noopener">Ninja Council 4 查克拉效果</a> · <a href="https://naruto-official.com/en/news/01_1321" target="_blank" rel="noopener">官方動畫回顧</a></p>
