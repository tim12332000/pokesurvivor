<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>火影動作演出 · 美術審閱室</title>
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">NARUTO · ANIMATION LAB</p>
      <h1>動作演出審閱室</h1>
      <p class="intro">先看動作，再決定保留。這裡是獨立分支的美術提案，尚未套用至遊戲。</p>
      <div class="meta"><span id="branch">讀取分支資訊…</span><span id="base"></span></div>
      <nav aria-label="參考資料"><a href="research.md" target="_blank" rel="noopener">研究與來源 ↗</a><a href="README.md" target="_blank" rel="noopener">資料夾與審閱說明 ↗</a></nav>
    </header>
    <section class="review-note" aria-label="審閱說明"><strong>等待你的最終審核</strong><p>候選圖已先由製作端篩選。按「認可」只會記錄在這個瀏覽器；合併仍需你明確同意，不會自動發生。</p></section>
    <section class="toolbar" aria-label="篩選與匯出">
      <div><label for="character">角色</label><select id="character"><option value="all">所有角色</option></select><span id="count" role="status"></span></div>

    </section>
    <p id="message" role="status">正在讀取候選作品…</p>
    <div id="gallery" class="gallery"></div>
    <footer>圖片集中於 <code>art-review/candidates/</code>，原始參考位於 <code>art-review/references/</code>。<br>審閱紀錄存於目前瀏覽器；關閉或清除瀏覽器資料前，請先匯出。</footer>
  </main>
