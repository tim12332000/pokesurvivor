<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1430">
<title>PokéSurvivor · 直式遊玩</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080e1a; color: #e6edf7; font-family: system-ui, sans-serif; }
  body { display: flex; justify-content: center; align-items: center; }
  iframe { display: block; border: 0; height: 100dvh; width: min(100vw, calc(100dvh * 390 / 844)); background: #0a1430; box-shadow: 0 0 48px #0008; }
  a { position: fixed; top: 16px; right: 16px; padding: 10px 14px; border: 1px solid #53627c; border-radius: 8px; background: #101c30; color: #e6edf7; text-decoration: none; font-size: 14px; }
  a:hover, a:focus-visible { background: #223450; outline: 2px solid #ffd36c; outline-offset: 3px; }
  @media (max-width: 650px) { a { top: 6px; right: 6px; padding: 6px 8px; font-size: 12px; opacity: .85; } }
</style>
</head>
<body>
<iframe id="portrait-game" title="PokéSurvivor 直式遊戲" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<a id="wide-layout" href="digimon.html?layout=wide">切換寬版</a>
<script>
  const game = new URL('digimon.html', location.href);
  game.search = location.search;
  game.searchParams.set('layout', 'portrait');
  game.hash = location.hash;
  const frame = document.getElementById('portrait-game');
  frame.src = game.href;
  frame.addEventListener('load', () => frame.contentWindow.focus());
  const wide = new URL(game);
  wide.searchParams.set('layout', 'wide');
  document.getElementById('wide-layout').href = wide.href;
</script>
</body>
</html>
