name: Publish modification to gh-pages

on:
  push:
    branches: [mod-main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: mod-main-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'tim12332000/pokesurvivor' && github.ref == 'refs/heads/mod-main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://tim12332000.github.io/pokesurvivor/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod-main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify catalog boundaries and behavior
        run: |
          node tools/test_catalog.js
          node tools/test_catalog_boundary.js
          node tools/test_catalog_baseline.js
          node tools/test_enemy_catalog.js
          node tools/test_mission_roster.js
          node tools/test_growth_contract.cjs
          node tools/test_combat_pulse.cjs
          node tools/test_trial_build_scope.cjs
          node tools/test_madara_framing.cjs
          python tools/test_publish_mod_pages.py
      - name: Refresh publication leases
        run: git fetch --no-tags origin +refs/heads/mod-main:refs/remotes/origin/mod-main +refs/heads/gh-pages:refs/remotes/origin/gh-pages
      - name: Set release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python tools/build_digimon_site.py
      - name: Publish fixed branch and release tag
        run: python tools/publish_mod_pages.py --push
      # GITHUB_TOKEN pushes do not trigger a legacy Pages build automatically:
      # https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
      - name: Request the existing legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/mod-main:refs/remotes/origin/mod-main +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          published_source=$(git show refs/remotes/origin/gh-pages:release.json | python -c "import json,sys; print(json.load(sys.stdin)['sourceCommit'])")
          test "$published_source" = "$(git rev-parse refs/remotes/origin/mod-main)"
          gh api repos/${{ github.repository }}/pages --jq '.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/"' | grep -qx true
          gh api --method POST repos/${{ github.repository }}/pages/builds
